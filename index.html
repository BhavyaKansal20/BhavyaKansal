    <!-- Global card ripple handler — fires on .card-ripple and .glass-card clicks -->
    <script>
      document.addEventListener('click', function(e) {
        var el = e.target.closest('.card-ripple, .glass-card');
        if (!el) return;
        // Do not fire on project cards
        if (el.closest('#projects')) return;
        var rect = el.getBoundingClientRect();
        var size = Math.max(rect.width, rect.height) * 1.4;
        var x = e.clientX - rect.left - size / 2;
        var y = e.clientY - rect.top - size / 2;
        var ripple = document.createElement('span');
        ripple.className = 'ripple-burst';
        ripple.style.cssText = 'width:' + size + 'px;height:' + size + 'px;left:' + x + 'px;top:' + y + 'px;';
        el.appendChild(ripple);
        setTimeout(function() { ripple.remove(); }, 650);
      }, true);
    </script>
  </body>
